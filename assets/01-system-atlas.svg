<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img"><title>The deployment rehearsal control plane.</title><desc>Customer intent → typed obligations → bounded scenarios → evidence-linked human handoff.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2c46" stroke-width="0.6" opacity="0.5"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7e9abc"/></marker></defs><rect width="1800" height="1220" fill="#080f20"/><rect width="1800" height="1220" fill="url(#grid)"/><text x="64" y="52" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="3">ASTERION   /   SYSTEM ATLAS</text><text x="1590" y="52" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="500" letter-spacing="2">01   /   08</text><text x="64" y="114" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="44" font-weight="650" letter-spacing="0">The deployment rehearsal control plane.</text><text x="64" y="157" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Customer intent → typed obligations → bounded scenarios → evidence-linked human handoff.</text><path d="M64 182H1736" stroke="#29405e"/><rect x="64" y="215" width="1672" height="210" rx="18" fill="none" stroke="#29405e" stroke-dasharray="8 7"/><text x="82" y="243" fill="#b0a4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1">01  /  CUSTOMER INTERFACE — LOCAL API IMPLEMENTED; ENTERPRISE IDENTITY IS A TARGET</text><rect x="86" y="262" width="380" height="138" rx="15" fill="#111e33" stroke="#29405e"/><rect x="86" y="282" width="4" height="98" rx="2" fill="#f1c87d"/><text x="109" y="290" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">INTENT</text><text x="109" y="320" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" letter-spacing="0">Customer acceptance contract</text><text x="109" y="350" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">9 owned obligations • 12 required cells</text><text x="109" y="370" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">Versioned synthetic YAML, not prose guesses</text><rect x="535" y="262" width="720" height="138" rx="15" fill="#111e33" stroke="#29405e"/><rect x="535" y="282" width="4" height="98" rx="2" fill="#65e3c5"/><text x="558" y="290" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">CONTROL SURFACE</text><text x="558" y="320" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">FastAPI admission + execution ledger</text><text x="558" y="350" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Mapped bearer principal → tenant namespace → idempotency key</text><text x="558" y="372" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">One synchronous local worker; no distributed queue is claimed</text><rect x="1325" y="262" width="390" height="138" rx="15" fill="#111e33" stroke="#29405e"/><rect x="1325" y="282" width="4" height="98" rx="2" fill="#f1c87d"/><text x="1348" y="290" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">AUTHORITY</text><text x="1348" y="320" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Human reviewer</text><text x="1348" y="350" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Digest-bound approve or reject</text><text x="1348" y="372" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">No application deployment endpoint</text><path d="M466 331L535 331" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M1255 331L1325 331" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="460" width="1672" height="458" rx="18" fill="none" stroke="#29405e" stroke-dasharray="8 7"/><text x="82" y="488" fill="#b0a4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1">02  /  EXECUTION + EVIDENCE — SHARED NODES; OPTIONAL NATIVE LANGGRAPH WIRING</text><rect x="86" y="512" width="370" height="163" rx="15" fill="#111e33" stroke="#29405e"/><rect x="86" y="532" width="4" height="123" rx="2" fill="#65e3c5"/><text x="109" y="540" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">DISCOVER</text><text x="109" y="570" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Integration Cartographer</text><text x="109" y="600" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Declares synthetic CRM / ERP</text><text x="109" y="622" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Records environment context</text><rect x="505" y="512" width="370" height="163" rx="15" fill="#111e33" stroke="#29405e"/><rect x="505" y="532" width="4" height="123" rx="2" fill="#b0a4ff"/><text x="528" y="540" fill="#b0a4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">PROPOSE</text><text x="528" y="570" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Scenario Architect</text><text x="528" y="600" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Deterministic catalog planning</text><text x="528" y="622" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Optional Bedrock ID proposal</text><rect x="925" y="512" width="370" height="163" rx="15" fill="#111e33" stroke="#29405e"/><rect x="925" y="532" width="4" height="123" rx="2" fill="#65e3c5"/><text x="948" y="540" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">EXECUTE</text><text x="948" y="570" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Rehearsal Fabric</text><text x="948" y="600" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Scripted target sees inputs only</text><text x="948" y="622" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Fixture effects remain in-process</text><rect x="1345" y="512" width="370" height="163" rx="15" fill="#111e33" stroke="#29405e"/><rect x="1345" y="532" width="4" height="123" rx="2" fill="#f1c87d"/><text x="1368" y="540" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">CHECK</text><text x="1368" y="570" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Independent verifier</text><text x="1368" y="600" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Curated expected outcomes</text><text x="1368" y="622" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">No oracle reaches target policy</text><path d="M456 594L505 594" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M875 594L925 594" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M1295 594L1345 594" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><rect x="86" y="723" width="510" height="155" rx="15" fill="#111e33" stroke="#29405e"/><rect x="86" y="743" width="4" height="115" rx="2" fill="#65e3c5"/><text x="109" y="751" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">WCG / CORE MECHANISM</text><text x="109" y="781" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Witness-Coverage Gate</text><text x="109" y="811" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Required obligation × operational slice</text><text x="109" y="833" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Unknown is HOLD; critical failure is BLOCKED</text><rect x="650" y="723" width="505" height="155" rx="15" fill="#111e33" stroke="#29405e"/><rect x="650" y="743" width="4" height="115" rx="2" fill="#f1c87d"/><text x="673" y="751" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">CONTENT INTEGRITY</text><text x="673" y="781" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Handoff Seal</text><text x="673" y="811" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Hashes contract, request, observations + witnesses</text><text x="673" y="833" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Review recomputes evidence before state transition</text><rect x="1210" y="723" width="505" height="155" rx="15" fill="#111e33" stroke="#29405e"/><rect x="1210" y="743" width="4" height="115" rx="2" fill="#65e3c5"/><text x="1233" y="751" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">EXPORT</text><text x="1233" y="781" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Acceptance capsule</text><text x="1233" y="811" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">JSON + HTML + Markdown + event journal</text><text x="1233" y="833" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Manifest is integrity evidence, not a signature</text><path d="M1530 675V696H340V723" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M596 800L650 800" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M1155 800L1210 800" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M1518 400L1518 460" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><text x="1526.0" y="420.0" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" letter-spacing="0">review</text><rect x="86" y="960" width="510" height="145" rx="15" fill="#111e33" stroke="#29405e"/><rect x="86" y="980" width="4" height="105" rx="2" fill="#65e3c5"/><text x="109" y="988" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">IMPLEMENTED</text><text x="109" y="1018" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">SQLite evidence ledger</text><text x="109" y="1048" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Idempotent admission • serialized review</text><text x="109" y="1070" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Same-host persistence, not fleet-scale storage</text><rect x="650" y="960" width="505" height="145" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="650" y="980" width="4" height="105" rx="2" fill="#b0a4ff"/><text x="673" y="988" fill="#b0a4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">OPTIONAL</text><text x="673" y="1018" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Native LangGraph checkpointer</text><text x="673" y="1048" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">StateGraph + SQLite saver + interrupt / resume</text><text x="673" y="1070" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Optional integration; verify separately</text><rect x="1210" y="960" width="505" height="145" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="1210" y="980" width="4" height="105" rx="2" fill="#f1c87d"/><text x="1233" y="988" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">DESIGN TARGET</text><text x="1233" y="1018" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">AWS / Azure reference topology</text><text x="1233" y="1048" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Private workers, managed identities, queue, store</text><text x="1233" y="1070" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Cloud target; not deployed by this repository</text><path d="M64 1152H1736" stroke="#29405e"/><text x="64" y="1184" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">Solid: local implementation. Purple/dashed: optional integration. Gold/dashed: reference architecture, not a deployed service.</text><text x="1475" y="1184" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="0">DESIGN + EVIDENCE / v0.1</text></svg>