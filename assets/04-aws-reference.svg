<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1270" viewBox="0 0 1800 1270" role="img"><title>AWS reference deployment.</title><desc>Architecture target for a customer-isolated service. Only the repository foundation is supplied as Terraform.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2c46" stroke-width="0.6" opacity="0.5"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7e9abc"/></marker></defs><rect width="1800" height="1270" fill="#080f20"/><rect width="1800" height="1270" fill="url(#grid)"/><text x="64" y="52" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="3">ASTERION   /   SYSTEM ATLAS</text><text x="1590" y="52" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="500" letter-spacing="2">04   /   08</text><text x="64" y="114" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="44" font-weight="650" letter-spacing="0">AWS reference deployment.</text><text x="64" y="157" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Architecture target for a customer-isolated service. Only the repository foundation is supplied as Terraform.</text><path d="M64 182H1736" stroke="#29405e"/><rect x="64" y="230" width="410" height="170" rx="15" fill="#111e33" stroke="#29405e"/><rect x="64" y="250" width="4" height="130" rx="2" fill="#b0a4ff"/><text x="87" y="258" fill="#b0a4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">BUILD PLANE</text><text x="87" y="288" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Developer trust boundary</text><text x="87" y="318" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">GitHub protected rehearsal environment</text><text x="87" y="340" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">OIDC subject: exact repository +</text><text x="87" y="362" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">environment</text><text x="87" y="384" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Manual image publish, never auto-rollout</text><rect x="555" y="230" width="480" height="170" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="555" y="250" width="4" height="130" rx="2" fill="#f1c87d"/><text x="578" y="258" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">IAC SOURCE</text><text x="578" y="288" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">ECR + encryption foundation</text><text x="578" y="318" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Immutable image tags • scan-on-push</text><text x="578" y="340" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">S3 private evidence bucket + KMS rotation</text><text x="578" y="362" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Terraform source supplied; not applied</text><rect x="1115" y="230" width="620" height="170" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="1115" y="250" width="4" height="130" rx="2" fill="#f1c87d"/><text x="1138" y="258" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">IAC SOURCE</text><text x="1138" y="288" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">CloudWatch + scoped IAM</text><text x="1138" y="318" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Image publisher can push to one ECR repository</text><text x="1138" y="340" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">No ECS rollout, customer data, or Bedrock rights</text><text x="1138" y="362" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Existing account OIDC provider is an input</text><path d="M474 315L555 315" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M1035 315L1115 315" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="440" width="1672" height="660" rx="18" fill="none" stroke="#29405e" stroke-dasharray="8 7"/><text x="82" y="468" fill="#b0a4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1">CUSTOMER AWS ACCOUNT / PRIVATE APPLICATION NETWORK — TARGET ONLY</text><rect x="90" y="494" width="455" height="160" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="90" y="514" width="4" height="120" rx="2" fill="#f1c87d"/><text x="113" y="522" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">ACCESS TARGET</text><text x="113" y="552" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">SSO + private ingress</text><text x="113" y="582" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Customer IdP → validated application principal</text><text x="113" y="604" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Internal ALB / VPN / enterprise ingress</text><text x="113" y="626" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">TLS, rate limits and authentication middleware</text><rect x="605" y="494" width="500" height="160" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="605" y="514" width="4" height="120" rx="2" fill="#f1c87d"/><text x="628" y="522" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">CONTROL TARGET</text><text x="628" y="552" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">ECS service + job admission</text><text x="628" y="582" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Stateless API • per-customer queue</text><text x="628" y="604" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Reject oversize jobs; return asynchronous run ID</text><text x="628" y="626" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Not the current SQLite synchronous API</text><rect x="1170" y="494" width="540" height="160" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="1170" y="514" width="4" height="120" rx="2" fill="#f1c87d"/><text x="1193" y="522" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">EXECUTION TARGET</text><text x="1193" y="552" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Isolated rehearsal workers</text><text x="1193" y="582" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">LangGraph orchestration + sandbox fixtures</text><text x="1193" y="604" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Task IAM role distinct from execution role</text><text x="1193" y="626" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">No production-write connector by default</text><path d="M545 580L605 580" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M1105 580L1170 580" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="714" width="455" height="160" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="90" y="734" width="4" height="120" rx="2" fill="#f1c87d"/><text x="113" y="742" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">STATE TARGET</text><text x="113" y="772" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Aurora PostgreSQL</text><text x="113" y="802" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Authoritative run + review transactions</text><text x="113" y="824" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Worker lease, outbox, row-level tenant policy</text><text x="113" y="846" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Replace SQLite before multi-replica service</text><rect x="605" y="714" width="500" height="160" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="605" y="734" width="4" height="120" rx="2" fill="#f1c87d"/><text x="628" y="742" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">EVIDENCE TARGET</text><text x="628" y="772" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">S3 evidence / KMS</text><text x="628" y="802" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Content manifest + retention policy</text><text x="628" y="824" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Per-customer access; optional signed attestations</text><text x="628" y="846" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Current code exports local files only</text><rect x="1170" y="714" width="540" height="160" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="1170" y="734" width="4" height="120" rx="2" fill="#b0a4ff"/><text x="1193" y="742" fill="#b0a4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">MODEL BOUNDARY</text><text x="1193" y="772" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Bedrock private model access</text><text x="1193" y="802" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Selected model / profile supplied by operator</text><text x="1193" y="824" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Only objective + scenario metadata in prompt</text><text x="1193" y="846" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Optional Boto3 adapter exists; live call untested</text><path d="M1440 654L1440 714" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M855 654L855 714" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 654V685H315V714" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="927" width="1620" height="127" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="90" y="947" width="4" height="87" rx="2" fill="#ff94a6"/><text x="113" y="955" fill="#ff94a6" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">UNIMPLEMENTED RELEASE GATES</text><text x="113" y="985" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Operational acceptance before a customer pilot</text><text x="113" y="1015" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Queue leasing and recovery • verified tenancy • secrets resolution • model budget • restore drill • incident owner</text><text x="113" y="1037" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Network egress policy and VPC endpoints must be designed together; this diagram is not a one-command deployment.</text><path d="M64 1202H1736" stroke="#29405e"/><text x="64" y="1234" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">Do not deploy the single-host SQLite demo as this topology. Cloud resources and paid inference require separate operator approval.</text><text x="1475" y="1234" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="0">DESIGN + EVIDENCE / v0.1</text></svg>