<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img"><title>Bounded autonomy. Explicit authority.</title><desc>The same domain nodes support a no-key reference runner and a native LangGraph state machine.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2c46" stroke-width="0.6" opacity="0.5"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7e9abc"/></marker></defs><rect width="1800" height="1160" fill="#080f20"/><rect width="1800" height="1160" fill="url(#grid)"/><text x="64" y="52" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="3">ASTERION   /   SYSTEM ATLAS</text><text x="1590" y="52" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="500" letter-spacing="2">02   /   08</text><text x="64" y="114" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="44" font-weight="650" letter-spacing="0">Bounded autonomy. Explicit authority.</text><text x="64" y="157" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">The same domain nodes support a no-key reference runner and a native LangGraph state machine.</text><path d="M64 182H1736" stroke="#29405e"/><rect x="80" y="270" width="295" height="150" rx="15" fill="#111e33" stroke="#29405e"/><rect x="80" y="290" width="4" height="110" rx="2" fill="#65e3c5"/><text x="103" y="298" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">VALIDATE</text><text x="103" y="328" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Intake</text><text x="103" y="358" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Strict input schemas</text><text x="103" y="380" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Contract + catalog digest</text><rect x="430" y="270" width="295" height="150" rx="15" fill="#111e33" stroke="#29405e"/><rect x="430" y="290" width="4" height="110" rx="2" fill="#65e3c5"/><text x="453" y="298" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">CONTEXT</text><text x="453" y="328" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Discover</text><text x="453" y="358" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Synthetic environment</text><text x="453" y="380" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">No live discovery call</text><rect x="780" y="270" width="295" height="150" rx="15" fill="#111e33" stroke="#29405e"/><rect x="780" y="290" width="4" height="110" rx="2" fill="#65e3c5"/><text x="803" y="298" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">SELECT</text><text x="803" y="328" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Plan</text><text x="803" y="358" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Whitelist catalog IDs</text><text x="803" y="380" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">At most 4 per batch</text><rect x="1130" y="270" width="295" height="150" rx="15" fill="#111e33" stroke="#29405e"/><rect x="1130" y="290" width="4" height="110" rx="2" fill="#65e3c5"/><text x="1153" y="298" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">EXECUTE</text><text x="1153" y="328" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Rehearse</text><text x="1153" y="358" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Input-only target access</text><text x="1153" y="380" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Separate curated oracle</text><path d="M375 344L430 344" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M725 344L780 344" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M1075 344L1130 344" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><rect x="1130" y="525" width="295" height="155" rx="15" fill="#111e33" stroke="#29405e"/><rect x="1130" y="545" width="4" height="115" rx="2" fill="#f1c87d"/><text x="1153" y="553" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">VERIFY</text><text x="1153" y="583" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Evaluate</text><text x="1153" y="613" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Reject stale witnesses</text><text x="1153" y="635" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Update cell coverage</text><path d="M1275 420L1275 525" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M1130 590H925V420" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><text x="675" y="483" fill="#b0a4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" letter-spacing="0">More eligible cases + remaining budget</text><rect x="740" y="525" width="295" height="155" rx="15" fill="#111e33" stroke="#29405e"/><rect x="740" y="545" width="4" height="115" rx="2" fill="#65e3c5"/><text x="763" y="553" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">BIND</text><text x="763" y="583" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Seal evidence</text><text x="763" y="613" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Terminal dossier digest</text><text x="763" y="635" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Pending / hold / blocked</text><path d="M1130 630L1035 630" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="525" width="570" height="155" rx="15" fill="#111e33" stroke="#29405e"/><rect x="80" y="545" width="4" height="115" rx="2" fill="#f1c87d"/><text x="103" y="553" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">BOUNDS</text><text x="103" y="583" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Hard termination conditions</text><text x="103" y="613" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">max_cases ≤ 64 • max_rounds ≤ 8</text><text x="103" y="635" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">No new permitted IDs → stop; no infinite repair loop</text><rect x="740" y="815" width="295" height="165" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="740" y="835" width="4" height="125" rx="2" fill="#b0a4ff"/><text x="763" y="843" fill="#b0a4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">OPTIONAL LANGGRAPH</text><text x="763" y="873" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Human interrupt</text><text x="763" y="903" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Exact digest approval</text><text x="763" y="925" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">No side effects before</text><text x="763" y="947" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">interrupt</text><path d="M887 680L887 815" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><text x="895.0" y="737.5" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" letter-spacing="0">complete + passing</text><rect x="1130" y="815" width="570" height="165" rx="15" fill="#111e33" stroke="#29405e"/><rect x="1130" y="835" width="4" height="125" rx="2" fill="#f1c87d"/><text x="1153" y="843" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">FINAL AUTHORITY</text><text x="1153" y="873" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Approve / reject capsule</text><text x="1153" y="903" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">A reviewer changes the rehearsal status only</text><text x="1153" y="925" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Stored event journal is replayed; not live token streaming</text><path d="M1035 895L1130 895" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="815" width="570" height="165" rx="15" fill="#111e33" stroke="#29405e"/><rect x="80" y="835" width="4" height="125" rx="2" fill="#ff94a6"/><text x="103" y="843" fill="#ff94a6" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">SAFE STOP</text><text x="103" y="873" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">HOLD / BLOCKED</text><text x="103" y="903" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Missing cells or failures stay visible</text><text x="103" y="925" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">No approval route for an incomplete dossier</text><path d="M740 615H692V790H365V815" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M64 1092H1736" stroke="#29405e"/><text x="64" y="1124" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">LangGraph interrupt nodes restart on resume. The review node performs no external effects before interrupt().</text><text x="1475" y="1124" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="0">DESIGN + EVIDENCE / v0.1</text></svg>