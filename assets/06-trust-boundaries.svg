<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img"><title>Trust the boundary, not the adjective.</title><desc>Every planner suggestion and evidence object crosses a concrete validation boundary.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2c46" stroke-width="0.6" opacity="0.5"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7e9abc"/></marker></defs><rect width="1800" height="1160" fill="#080f20"/><rect width="1800" height="1160" fill="url(#grid)"/><text x="64" y="52" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="3">ASTERION   /   SYSTEM ATLAS</text><text x="1590" y="52" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="500" letter-spacing="2">06   /   08</text><text x="64" y="114" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="44" font-weight="650" letter-spacing="0">Trust the boundary, not the adjective.</text><text x="64" y="157" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Every planner suggestion and evidence object crosses a concrete validation boundary.</text><path d="M64 182H1736" stroke="#29405e"/><rect x="64" y="225" width="500" height="718" rx="18" fill="none" stroke="#29405e" stroke-dasharray="8 7"/><text x="82" y="253" fill="#b0a4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1">UNTRUSTED / LIMITED AUTHORITY</text><rect x="88" y="284" width="450" height="160" rx="15" fill="#111e33" stroke="#29405e"/><rect x="88" y="304" width="4" height="120" rx="2" fill="#65e3c5"/><text x="111" y="312" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">API BOUNDARY</text><text x="111" y="342" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Client request</text><text x="111" y="372" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Bearer token resolves tenant server-side</text><text x="111" y="394" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Cannot choose another tenant in run JSON</text><text x="111" y="416" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Idempotency key binds exact request</text><rect x="88" y="484" width="450" height="168" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="88" y="504" width="4" height="128" rx="2" fill="#b0a4ff"/><text x="111" y="512" fill="#b0a4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">MODEL BOUNDARY</text><text x="111" y="542" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Optional model proposal</text><text x="111" y="572" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Only catalog IDs, never executable code</text><text x="111" y="594" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">No expected outcomes or raw notes sent</text><text x="111" y="616" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Unknown IDs dropped; case budget enforced</text><rect x="88" y="690" width="450" height="195" rx="15" fill="#111e33" stroke="#29405e"/><rect x="88" y="710" width="4" height="155" rx="2" fill="#65e3c5"/><text x="111" y="718" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">TARGET BOUNDARY</text><text x="111" y="748" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Scripted target policy</text><text x="111" y="778" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Receives CaseInput, never Scenario.expected</text><text x="111" y="800" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Untrusted note remains fixture data</text><text x="111" y="822" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">No model prompt-injection resistance measured</text><rect x="650" y="225" width="590" height="718" rx="18" fill="none" stroke="#29405e" stroke-dasharray="8 7"/><text x="668" y="253" fill="#b0a4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1">TRUSTED EVALUATION CORE</text><rect x="677" y="284" width="535" height="160" rx="15" fill="#111e33" stroke="#29405e"/><rect x="677" y="304" width="4" height="120" rx="2" fill="#f1c87d"/><text x="700" y="312" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">TRUST ROOT</text><text x="700" y="342" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Contract + curated oracle</text><text x="700" y="372" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Human-authored constraints and golden outcomes</text><text x="700" y="394" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Immutable-by-convention for one rehearsal</text><text x="700" y="416" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Wrong oracle can still produce a wrong verdict</text><rect x="677" y="484" width="535" height="168" rx="15" fill="#111e33" stroke="#29405e"/><rect x="677" y="504" width="4" height="128" rx="2" fill="#65e3c5"/><text x="700" y="512" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">REFERENCE MONITOR</text><text x="700" y="542" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Witness validation</text><text x="700" y="572" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Contract / scenario / target / run bindings</text><text x="700" y="594" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Expected field checks + witness coherence</text><text x="700" y="616" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Unbound or invalid evidence blocks handoff</text><rect x="677" y="690" width="535" height="195" rx="15" fill="#111e33" stroke="#29405e"/><rect x="677" y="710" width="4" height="155" rx="2" fill="#f1c87d"/><text x="700" y="718" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">HUMAN AUTHORITY</text><text x="700" y="748" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Review transaction</text><text x="700" y="778" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Recompute dossier digest before approval</text><text x="700" y="800" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Reviewer principal required at API boundary</text><text x="700" y="822" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Local CLI trusts the operating-system user</text><path d="M538 360L677 360" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M538 568L677 568" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M538 790H604V610H677" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><rect x="1320" y="284" width="415" height="250" rx="15" fill="#111e33" stroke="#29405e"/><rect x="1320" y="304" width="4" height="210" rx="2" fill="#f1c87d"/><text x="1343" y="312" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">EVIDENCE LIMIT</text><text x="1343" y="342" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Exports are not proof</text><text x="1343" y="372" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">JSON / HTML / journal + hashes</text><text x="1343" y="394" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Same-host SHA-256 integrity</text><text x="1343" y="416" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">No evaluator attestation</text><text x="1343" y="438" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">No cryptographic signatures</text><text x="1343" y="460" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">No immutable external audit log</text><rect x="1320" y="614" width="415" height="271" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="1320" y="634" width="4" height="231" rx="2" fill="#ff94a6"/><text x="1343" y="642" fill="#ff94a6" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">DESIGN TARGET</text><text x="1343" y="672" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Production hardening gap</text><text x="1343" y="702" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">SSO / tenant DB policy</text><text x="1343" y="724" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Asynchronous admission</text><text x="1343" y="746" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Process and network sandbox</text><text x="1343" y="768" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Signed source + binary identity</text><text x="1343" y="790" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Restore and crash recovery drill</text><path d="M1212 775L1320 775" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><text x="82" y="1013" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="0">A hostile evaluator can fabricate internally consistent observations. Hashing does not eliminate that trust assumption.</text><path d="M64 1092H1736" stroke="#29405e"/><text x="64" y="1124" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">No PHI, real customer records, cloud credentials, live financial actions, or production connectors are included.</text><text x="1475" y="1124" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="0">DESIGN + EVIDENCE / v0.1</text></svg>