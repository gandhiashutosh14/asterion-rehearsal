<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1170" viewBox="0 0 1800 1170" role="img"><title>The evidence model.</title><desc>Bind observations to the requirement they discharge, then bind approval to the complete evidence set.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2c46" stroke-width="0.6" opacity="0.5"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7e9abc"/></marker></defs><rect width="1800" height="1170" fill="#080f20"/><rect width="1800" height="1170" fill="url(#grid)"/><text x="64" y="52" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="3">ASTERION   /   SYSTEM ATLAS</text><text x="1590" y="52" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="500" letter-spacing="2">08   /   08</text><text x="64" y="114" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="44" font-weight="650" letter-spacing="0">The evidence model.</text><text x="64" y="157" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Bind observations to the requirement they discharge, then bind approval to the complete evidence set.</text><path d="M64 182H1736" stroke="#29405e"/><rect x="64" y="245" width="480" height="185" rx="15" fill="#111e33" stroke="#29405e"/><rect x="64" y="265" width="4" height="145" rx="2" fill="#f1c87d"/><text x="87" y="273" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">CUSTOMER ACCEPTANCE</text><text x="87" y="303" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Contract</text><text x="87" y="333" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">id • version • objective • classification</text><text x="87" y="355" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Obligation[]: id, owner, critical, required_slices</text><text x="87" y="377" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Canonical JSON → contract digest</text><rect x="660" y="245" width="480" height="185" rx="15" fill="#111e33" stroke="#29405e"/><rect x="660" y="265" width="4" height="145" rx="2" fill="#65e3c5"/><text x="683" y="273" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">CURATED REHEARSAL</text><text x="683" y="303" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Scenario</text><text x="683" y="333" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">id • operational slice • CaseInput</text><text x="683" y="355" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">expected[obligation_id] = curated field checks</text><text x="683" y="377" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Scenario digest binds inputs + golden checks</text><rect x="1260" y="245" width="475" height="185" rx="15" fill="#111e33" stroke="#29405e"/><rect x="1260" y="265" width="4" height="145" rx="2" fill="#65e3c5"/><text x="1283" y="273" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">TARGET OUTPUT</text><text x="1283" y="303" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Observation</text><text x="1283" y="333" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">decision • owner • source count • effects</text><text x="1283" y="355" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">cross-tenant flag • modeled deadline • trace</text><text x="1283" y="377" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Produced by input-only ScriptedTarget</text><path d="M544 337L660 337" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M1140 337L1260 337" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><text x="1208.0" y="327.0" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" letter-spacing="0">inputs only</text><rect x="64" y="542" width="480" height="205" rx="15" fill="#111e33" stroke="#29405e"/><rect x="64" y="562" width="4" height="165" rx="2" fill="#65e3c5"/><text x="87" y="570" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">EXECUTION RECORD</text><text x="87" y="600" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Run</text><text x="87" y="630" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">run_id • request • target_version • rounds</text><text x="87" y="652" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">selected IDs • witnesses • observations • events</text><text x="87" y="674" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Tenant binding stays in the local ledger</text><rect x="660" y="542" width="480" height="205" rx="15" fill="#111e33" stroke="#29405e"/><rect x="660" y="562" width="4" height="165" rx="2" fill="#b0a4ff"/><text x="683" y="570" fill="#b0a4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">VERIFIABLE SHAPE</text><text x="683" y="600" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Witness</text><text x="683" y="630" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">run / contract / scenario / target bindings</text><text x="683" y="652" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">obligation_id • slice • expected • observed</text><text x="683" y="674" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">passed • mismatch fields • content digest</text><rect x="1260" y="542" width="475" height="205" rx="15" fill="#111e33" stroke="#29405e"/><rect x="1260" y="562" width="4" height="165" rx="2" fill="#f1c87d"/><text x="1283" y="570" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">DETERMINISTIC GATE</text><text x="1283" y="600" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Assessment</text><text x="1283" y="630" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Cell state: PASS / FAIL / MISSING</text><text x="1283" y="652" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Coverage • observed witness pass rate</text><text x="1283" y="674" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Counterexamples • missing cells • invalid count</text><path d="M895 430L895 542" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M1495 430V488H1140V615" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M544 645L660 645" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M1140 645L1260 645" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="856" width="800" height="170" rx="15" fill="#111e33" stroke="#29405e"/><rect x="64" y="876" width="4" height="130" rx="2" fill="#f1c87d"/><text x="87" y="884" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">DIGEST-BOUND HUMAN DECISION</text><text x="87" y="914" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Review</text><text x="87" y="944" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">approve / reject • rationale • expected evidence_digest • actor</text><text x="87" y="966" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Serial transaction checks pending state + recomputed digest</text><text x="87" y="988" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">No modification of the contract or witnesses during approval</text><rect x="955" y="856" width="780" height="170" rx="15" fill="#111e33" stroke="#29405e"/><rect x="955" y="876" width="4" height="130" rx="2" fill="#65e3c5"/><text x="978" y="884" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">LOCAL ARTIFACT</text><text x="978" y="914" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Portable handoff capsule</text><text x="978" y="944" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">report.json + report.html + report.md + events.jsonl + manifest.json</text><text x="978" y="966" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">File hashes detect edits; they do not prove who executed the test</text><text x="978" y="988" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Source manifest in benchmark summary identifies evaluated source files</text><path d="M1495 747V797H455V856" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M864 941L955 941" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M64 1102H1736" stroke="#29405e"/><text x="64" y="1134" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">The trusted evaluator and authored oracle remain assumptions. Production source attestation and signed approval are future work.</text><text x="1475" y="1134" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="0">DESIGN + EVIDENCE / v0.1</text></svg>