<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img"><title>The Witness-Coverage Gate.</title><desc>A 100% score over observed examples says nothing about the required situations you did not test.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2c46" stroke-width="0.6" opacity="0.5"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7e9abc"/></marker></defs><rect width="1800" height="1160" fill="#080f20"/><rect width="1800" height="1160" fill="url(#grid)"/><text x="64" y="52" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="3">ASTERION   /   SYSTEM ATLAS</text><text x="1590" y="52" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="500" letter-spacing="2">03   /   08</text><text x="64" y="114" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="44" font-weight="650" letter-spacing="0">The Witness-Coverage Gate.</text><text x="64" y="157" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">A 100% score over observed examples says nothing about the required situations you did not test.</text><path d="M64 182H1736" stroke="#29405e"/><rect x="64" y="225" width="520" height="185" rx="15" fill="#111e33" stroke="#29405e"/><rect x="64" y="245" width="4" height="145" rx="2" fill="#f1c87d"/><text x="87" y="253" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">CONTRACT</text><text x="87" y="283" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Required cells</text><text x="87" y="313" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">R = {(obligation, operational slice)}</text><text x="87" y="335" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Coverage = observed required cells / |R|</text><text x="87" y="357" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Coverage measures scope, not probability.</text><rect x="64" y="447" width="520" height="205" rx="15" fill="#111e33" stroke="#29405e"/><rect x="64" y="467" width="4" height="165" rx="2" fill="#65e3c5"/><text x="87" y="475" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">EVIDENCE</text><text x="87" y="505" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Compatible witness</text><text x="87" y="535" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Binds run + contract + scenario + target version</text><text x="87" y="557" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Independent expected checks vs observed fields</text><text x="87" y="579" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Duplicate witness IDs cannot inflate coverage.</text><rect x="64" y="692" width="520" height="200" rx="15" fill="#111e33" stroke="#29405e"/><rect x="64" y="712" width="4" height="160" rx="2" fill="#b0a4ff"/><text x="87" y="720" fill="#b0a4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">DECISION</text><text x="87" y="750" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Gate precedence</text><text x="87" y="780" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Critical failure / invalid witness → BLOCKED</text><text x="87" y="802" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Missing or advisory failure → HOLD</text><text x="87" y="824" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">All covered and passing → READY_FOR_REVIEW</text><rect x="630" y="225" width="1106" height="667" rx="18" fill="none" stroke="#29405e" stroke-dasharray="8 7"/><text x="648" y="253" fill="#b0a4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1">MEASURED SYNTHETIC CASE STUDY / REFERENCE ENGINE / NO LLM CALLS</text><text x="660" y="310" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1">TARGET / SUITE</text><text x="1040" y="310" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1">CASES</text><text x="1160" y="310" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1">COVERAGE</text><text x="1355" y="310" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1">PASS RATE</text><text x="1510" y="310" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1">STATE</text><path d="M652 407H1710" stroke="#29405e"/><text x="660" y="379" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Optimistic / happy-only</text><text x="1040" y="379" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">2</text><text x="1160" y="379" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">1 / 12</text><text x="1355" y="379" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">100%</text><text x="1510" y="379" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="0">HOLD</text><path d="M652 492H1710" stroke="#29405e"/><text x="660" y="464" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Optimistic / complete</text><text x="1040" y="464" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">13</text><text x="1160" y="464" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">12 / 12</text><text x="1355" y="464" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">23.1%</text><text x="1510" y="464" fill="#ff94a6" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="0">BLOCKED</text><path d="M652 577H1710" stroke="#29405e"/><text x="660" y="549" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Guarded / happy-only</text><text x="1040" y="549" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">2</text><text x="1160" y="549" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">1 / 12</text><text x="1355" y="549" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">100%</text><text x="1510" y="549" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="0">HOLD</text><path d="M652 662H1710" stroke="#29405e"/><text x="660" y="634" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Guarded / complete</text><text x="1040" y="634" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">13</text><text x="1160" y="634" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">12 / 12</text><text x="1355" y="634" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">100%</text><text x="1510" y="634" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="0">REVIEW</text><text x="660" y="770" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="0">The optimistic policy fails 10 required cells in the full suite.</text><text x="660" y="811" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" letter-spacing="0">The happy-only baseline misses them by never visiting those cells.</text><text x="660" y="849" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" letter-spacing="0">All outcomes are generated by scripted policies over authored synthetic fixtures.</text><rect x="64" y="935" width="1672" height="113" rx="15" fill="#111e33" stroke="#29405e"/><rect x="64" y="955" width="4" height="73" rx="2" fill="#f1c87d"/><text x="87" y="963" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">SCOPE</text><text x="87" y="993" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">What is not claimed</text><text x="87" y="1023" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">No statistical reliability bound, certified safety case, novel theorem, or production readiness guarantee.</text><path d="M64 1092H1736" stroke="#29405e"/><text x="64" y="1124" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">Results: reports/reference/summary.json. “Pass rate” means passing witnesses / observed witnesses; not assertion-level accuracy.</text><text x="1475" y="1124" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="0">DESIGN + EVIDENCE / v0.1</text></svg>