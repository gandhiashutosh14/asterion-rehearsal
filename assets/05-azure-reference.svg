<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1190" viewBox="0 0 1800 1190" role="img"><title>Azure reference deployment.</title><desc>Equivalent responsibilities, not a claim of interchangeable clouds or an implemented Azure adapter.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2c46" stroke-width="0.6" opacity="0.5"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7e9abc"/></marker></defs><rect width="1800" height="1190" fill="#080f20"/><rect width="1800" height="1190" fill="url(#grid)"/><text x="64" y="52" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="3">ASTERION   /   SYSTEM ATLAS</text><text x="1590" y="52" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="500" letter-spacing="2">05   /   08</text><text x="64" y="114" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="44" font-weight="650" letter-spacing="0">Azure reference deployment.</text><text x="64" y="157" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Equivalent responsibilities, not a claim of interchangeable clouds or an implemented Azure adapter.</text><path d="M64 182H1736" stroke="#29405e"/><rect x="64" y="225" width="480" height="165" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="64" y="245" width="4" height="125" rx="2" fill="#f1c87d"/><text x="87" y="253" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">TRUST TARGET</text><text x="87" y="283" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Identity + access</text><text x="87" y="313" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Entra ID validates customer users</text><text x="87" y="335" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Managed identity represents the workload</text><text x="87" y="357" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Application still enforces tenant authorization</text><rect x="640" y="225" width="500" height="165" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="640" y="245" width="4" height="125" rx="2" fill="#f1c87d"/><text x="663" y="253" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">DELIVERY TARGET</text><text x="663" y="283" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Container delivery</text><text x="663" y="313" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">GitHub federated credentials → ACR</text><text x="663" y="335" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Container Apps with private environment</text><text x="663" y="357" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Protected promotion gates and image digests</text><rect x="1230" y="225" width="505" height="165" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="1230" y="245" width="4" height="125" rx="2" fill="#f1c87d"/><text x="1253" y="253" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">OPERATIONS TARGET</text><text x="1253" y="283" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Operational ownership</text><text x="1253" y="313" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Azure Monitor / Application Insights</text><text x="1253" y="335" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">OpenTelemetry export with data minimization</text><text x="1253" y="357" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Owner, incident contact and restore checklist</text><path d="M544 307L640 307" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M1140 307L1230 307" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="435" width="1672" height="565" rx="18" fill="none" stroke="#29405e" stroke-dasharray="8 7"/><text x="82" y="463" fill="#b0a4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1">PRIVATE CUSTOMER ENVIRONMENT / TARGET ARCHITECTURE / NO AZURE IAC OR SDK ADAPTER SHIPPED</text><rect x="90" y="490" width="470" height="165" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="90" y="510" width="4" height="125" rx="2" fill="#f1c87d"/><text x="113" y="518" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">CONTROL TARGET</text><text x="113" y="548" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">API + admission</text><text x="113" y="578" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Container Apps API / private ingress</text><text x="113" y="600" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Service Bus work queue and dead-letter path</text><text x="113" y="622" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Replace synchronous local admission</text><rect x="665" y="490" width="470" height="165" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="665" y="510" width="4" height="125" rx="2" fill="#f1c87d"/><text x="688" y="518" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">EXECUTION TARGET</text><text x="688" y="548" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Rehearsal execution</text><text x="688" y="578" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Dedicated worker identity per boundary</text><text x="688" y="600" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Same typed contracts and witness schema</text><text x="688" y="622" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">No customer operations from a planner prompt</text><rect x="1240" y="490" width="470" height="165" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="1240" y="510" width="4" height="125" rx="2" fill="#b0a4ff"/><text x="1263" y="518" fill="#b0a4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">OPTIONAL FUTURE</text><text x="1263" y="548" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Model gateway</text><text x="1263" y="578" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Azure AI Foundry endpoint</text><text x="1263" y="600" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Managed identity, region + budget policy</text><text x="1263" y="622" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Adapter intentionally not implemented</text><path d="M560 572L665 572" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M1135 572L1240 572" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="725" width="470" height="170" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="90" y="745" width="4" height="130" rx="2" fill="#f1c87d"/><text x="113" y="753" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">STATE TARGET</text><text x="113" y="783" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">PostgreSQL Flexible Server</text><text x="113" y="813" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Run ledger and human review transaction</text><text x="113" y="835" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Versioned migration and backup policy</text><text x="113" y="857" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Tenant isolation requires dedicated validation</text><rect x="665" y="725" width="470" height="170" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="665" y="745" width="4" height="130" rx="2" fill="#f1c87d"/><text x="688" y="753" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">EVIDENCE TARGET</text><text x="688" y="783" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Blob evidence vault</text><text x="688" y="813" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Private endpoints + customer retention rules</text><text x="688" y="835" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Content manifests with access controls</text><text x="688" y="857" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Do not confuse blob immutability with truth</text><rect x="1240" y="725" width="470" height="170" rx="15" fill="#111e33" stroke="#29405e" stroke-dasharray="8 6"/><rect x="1240" y="745" width="4" height="130" rx="2" fill="#f1c87d"/><text x="1263" y="753" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">SECRET TARGET</text><text x="1263" y="783" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Key Vault + network policy</text><text x="1263" y="813" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Workload identity, no keys in prompts</text><text x="1263" y="835" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Private access + least-privilege RBAC</text><text x="1263" y="857" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Egress allowlists and credential rotation</text><path d="M320 655L320 725" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M900 655L900 725" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M1475 655L1475 725" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><text x="90" y="1050" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="0">Portability seam: domain contracts + observations + witness verification, not provider-specific infrastructure.</text><path d="M64 1122H1736" stroke="#29405e"/><text x="64" y="1154" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">Cloud mapping supports an architecture discussion. This repository makes no Azure deployment or compliance claim.</text><text x="1475" y="1154" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="0">DESIGN + EVIDENCE / v0.1</text></svg>