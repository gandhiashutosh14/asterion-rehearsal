<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720" role="img"><title>ASTERION</title><desc>Evidence-linked deployment rehearsals for enterprise agents.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2c46" stroke-width="0.6" opacity="0.5"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7e9abc"/></marker></defs><rect width="1800" height="720" fill="#080f20"/><rect width="1800" height="720" fill="url(#grid)"/><text x="64" y="52" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="3">ASTERION   /   SYSTEM ATLAS</text><text x="1590" y="52" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="500" letter-spacing="2">01   /   08</text><text x="64" y="114" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="44" font-weight="650" letter-spacing="0">ASTERION</text><text x="64" y="157" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Evidence-linked deployment rehearsals for enterprise agents.</text><path d="M64 182H1736" stroke="#29405e"/><rect x="64" y="247" width="970" height="215" rx="15" fill="#111e33" stroke="#29405e"/><rect x="64" y="267" width="4" height="175" rx="2" fill="#65e3c5"/><text x="87" y="275" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">FORWARD-DEPLOYED ENGINEERING</text><text x="87" y="305" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Ship the evidence. Not just the demo.</text><text x="87" y="335" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Customer acceptance contracts become bounded failure-mode rehearsals,</text><text x="87" y="357" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">then a reviewable, digest-bound handoff capsule.</text><path d="M1255 493V203H1545V471H1277V225" fill="none" stroke="#65e3c5" stroke-width="4" opacity="0.8"/><path d="M1272 476V220H1528V454H1294V242" fill="none" stroke="#b0a4ff" stroke-width="4" opacity="0.73"/><path d="M1289 459V237H1511V437H1311V259" fill="none" stroke="#65e3c5" stroke-width="4" opacity="0.66"/><path d="M1306 442V254H1494V420H1328V276" fill="none" stroke="#b0a4ff" stroke-width="4" opacity="0.5900000000000001"/><path d="M1323 425V271H1477V403H1345V293" fill="none" stroke="#65e3c5" stroke-width="4" opacity="0.52"/><path d="M1340 408V288H1460V386H1362V310" fill="none" stroke="#b0a4ff" stroke-width="4" opacity="0.45"/><path d="M1357 391V305H1443V369H1379V327" fill="none" stroke="#65e3c5" stroke-width="4" opacity="0.38"/><text x="66" y="534" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="2">WITNESS-COVERAGE GATE</text><text x="66" y="578" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" letter-spacing="0">LANGGRAPH  /  FASTAPI  /  SYNTHETIC DIGITAL TWIN  /  AWS + AZURE DESIGN</text><path d="M64 652H1736" stroke="#29405e"/><text x="64" y="684" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">Runnable local prototype + engineering atlas. Cloud topology is a reference design, not a deployed service.</text><text x="1475" y="684" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="0">DESIGN + EVIDENCE / v0.1</text></svg>