ff capsule</text><path d="M1327 525L1327 595" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><rect x="1490" y="290" width="245" height="235" rx="15" fill="#111e33" stroke="#29405e"/><rect x="1490" y="310" width="4" height="195" rx="2" fill="#65e3c5"/><text x="1513" y="318" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">PHASE 06</text><text x="1513" y="348" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Operate</text><text x="1513" y="378" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Name the responder</text><text x="1513" y="400" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Feed gaps into next run</text><rect x="1490" y="595" width="245" height="210" rx="15" fill="#111e33" stroke="#29405e"/><rect x="1490" y="615" width="4" height="170" rx="2" fill="#f1c87d"/><text x="1513" y="623" fill="#f1c87d" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">IN REPOSITORY</text><text x="1513" y="653" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">Deliverables</text><text x="1513" y="683" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Runbook + RACI</text><text x="1513" y="705" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Pilot exit checklist</text><path d="M1612 525L1612 595" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M309 395L350 395" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M595 395L635 395" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M880 395L920 395" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M1165 395L1205 395" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><path d="M1450 395L1490 395" fill="none" stroke="#7e9abc" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="857" width="1672" height="179" rx="18" fill="none" stroke="#29405e" stroke-dasharray="8 7"/><text x="82" y="885" fill="#b0a4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1">STAFF-LEVEL DESIGN JUDGMENT</text><text x="90" y="922" fill="#edf4ff" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="600" letter-spacing="0">Prefer one falsifiable acceptance claim over ten unverified platform promises.</text><text x="90" y="968" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" letter-spacing="0">ADR decisions: bounded planning • oracle separation • local-first evidence • explicit cloud boundary • independent approval.</text><path d="M64 1092H1736" stroke="#29405e"/><text x="64" y="1124" fill="#9cacc4" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">Synthetic engagement kit: docs/fde/. No real customer endorsement, adoption, revenue impact or production outcome is implied.</text><text x="1475" y="1124" fill="#65e3c5" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="0">DESIGN + EVIDENCE / v0.1</text></svg>