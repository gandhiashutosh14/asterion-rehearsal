services:
  rehearsal:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ASTERION_API_TOKENS: "${ASTERION_API_TOKENS:?Set a JSON token-to-principal map before starting}"
    volumes:
      - rehearsal-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
volumes:
  rehearsal-data:
