[build-system]
# 77+ is required for the SPDX string form of `license` below (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asterion-rehearsal"
version = "0.1.0"
description = "Customer-specific agent deployment rehearsals with obligation-linked evidence and human handoff."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ashutosh Gandhi"}]
keywords = ["agents", "langgraph", "acceptance-testing", "human-in-the-loop", "evaluation", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
agent = ["langgraph==1.2.10", "langgraph-checkpoint-sqlite>=3,<4"]
cloud = ["boto3>=1.35,<2"]
telemetry = ["opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1"]

[project.urls]
Repository = "https://github.com/gandhiashutosh14/asterion-rehearsal"
Documentation = "https://github.com/gandhiashutosh14/asterion-rehearsal/blob/main/docs/ARCHITECTURE.md"
Changelog = "https://github.com/gandhiashutosh14/asterion-rehearsal/blob/main/CHANGELOG.md"

[project.scripts]
asterion = "asterion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asterion = ["data/*.json", "data/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["framework: requires the optional LangGraph dependencies"]

[tool.coverage.run]
source = ["src/asterion"]
branch = true

[tool.ruff]
line-length = 100
